<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <!-- Transparent Background for pure icon use -->

  <!-- Browser Window Frame -->
  <g transform="translate(43, 20)">
    <!-- Browser Window Body -->
    <rect x="0" y="0" width="170" height="130" rx="12" fill="#EEF0EC" stroke="#26313A" stroke-width="6" stroke-linejoin="round" />

    <!-- Browser Top Bar Divider Line -->
    <line x1="0" y1="30" x2="170" y2="30" stroke="#26313A" stroke-width="6" />

    <!-- Browser Window Control Dots -->
    <circle cx="18" cy="15" r="4.5" fill="#26313A" />
    <circle cx="34" cy="15" r="4.5" fill="#26313A" />
    <circle cx="50" cy="15" r="4.5" fill="#26313A" />

    <!-- Gold / Signal Circle Badge -->
    <circle cx="85" cy="80" r="39" fill="#D9A54A" />

    <!-- REFINED SHIELD: Exactly matching the clear geometric look from the final approved design -->
    <path d="M 85 54 L 107 61 V 78 C 107 93, 96 102, 85 106 C 74 102, 63 93, 63 78 V 61 Z"
          fill="#EEF0EC"
          stroke="#26313A"
          stroke-width="5"
          stroke-linejoin="round"
          stroke-linecap="round" />

    <!-- Tick / Checkmark inside Shield -->
    <path d="M 74 81 L 82 89 L 96 73"
          fill="none"
          stroke="#26313A"
          stroke-width="6"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

